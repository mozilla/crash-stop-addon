[project]
name = "crash-stop-addon"
version = "0.1.0"
description = "Server backing the Bugzilla crash-stop WebExtension: displays crash data and patch information in an iframe."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.14"
dependencies = [
    "python-dateutil>=2.9.0",
    "libmozdata>=0.2.14",
    "jinja2>=3.1.6",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.0.51",
    "honcho>=2.0.0",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "apscheduler>=3.11,<4",
    "python-binary-memcached>=0.32.0",
    "requests>=2.34.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
test = [
    "flake8>=7.1.0",
    "pytest>=8.3.0",
    "pytest-flask>=1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: hits live Mozilla APIs (Socorro/Buildhub/hg) or needs fixtures regenerated after the fennec->fenix rework; deselected in CI via `-m 'not integration'`.",
]
